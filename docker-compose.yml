services:
  backend:
    build: ./backend
    container_name: bannerhound-backend
    ports:
      # Bound to localhost only: the API has no authentication,
      # so it must not be reachable from the rest of the network
      - "127.0.0.1:8000:8000"
    environment:
      # Browser origins allowed to call the API (comma separated)
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      # Keep scanning limited to private networks
      - ALLOW_PUBLIC_SCAN=false
    volumes:
      # CSV reports survive container restarts
      - reports:/app/data
    # The scanner only needs plain TCP sockets, so no Linux capability is required
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: bannerhound-frontend
    ports:
      - "127.0.0.1:5173:80"
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  reports: