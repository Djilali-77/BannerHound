# Ruff settings shared by local development and CI
target-version = "py311"

[lint]
select = [
    "E4", "E7", "E9",  # pycodestyle errors
    "F",               # pyflakes
    "UP",              # pyupgrade (modern Python syntax)
    "BLE",             # no blind "except Exception" without logging
    "S110",            # no silent "except: pass"
]